<h2 class="font-mono text-[clamp(2rem,4vw,3rem)] font-bold text-[#F8FAFC]">My Projects ___.</h2>
<p class="mt-4 max-w-[780px] text-[20px] leading-[1.7] text-[#94A3B8]">
  A selection of projects I designed and built, focused on performance, maintainability, and clear user experience.
</p>
<div class="mt-8 grid grid-cols-1 gap-5 md:grid-cols-3">
  <article *ngFor="let project of projectCards"
    class="rounded-[12px] border border-[rgba(148,163,184,0.3)] bg-[#0F172A]/60 p-6 transition duration-200 ease-in hover:border-[#60A5FA]">
    <div
      class="inline-flex h-10 w-10 items-center justify-center rounded-[8px] border border-[rgba(148,163,184,0.25)] text-[#60A5FA]">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h10" />
      </svg>
    </div>
    <h4 class="mt-4 text-[30px] leading-tight text-[#E2E8F0]">{{ project.title }}</h4>
    <p class="mt-3 text-[19px] leading-[1.6] text-[#94A3B8]">{{ project.description }}</p>
  </article>
</div>
<div class="mt-8 text-center">
  <a href="https://github.com/dimitrije-savatic" target="_blank" rel="noreferrer"
    class="group hidden rounded-[999px] border border-[#60A5FA]/85 px-7 py-3 text-[14px] font-medium text-white transition duration-200 ease-in hover:brightness-120 md:inline-flex">
    View all projects
    <svg viewBox="0 0 24 24"
      class="arrow-animate h-4 w-4 ml-2 opacity-70 transition-all duration-200 ease-out group-hover:opacity-100"
      fill="none" stroke="currentColor" stroke-width="1.6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
    </svg>
  </a>
</div>
